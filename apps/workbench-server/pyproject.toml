[project]
name = "workbench-server"
version = "0.1.0"
description = "Workbench companion: the Rust game layer next to Plane (scrap, Tool Cupboard, wipes, tech tree, live notices)"
license = "AGPL-3.0-only"
requires-python = ">=3.12"
dependencies = [
    "starlette>=0.47",
    "uvicorn>=0.35",
    "httpx>=0.28",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.12"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
